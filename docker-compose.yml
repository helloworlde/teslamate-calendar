services:
  teslamate-calendar:
    image: ghcr.io/helloworlde/teslamate-calendar:latest
    container_name: teslamate-calendar
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      LISTEN_ADDR: ":8080"
      TESLAMATE_API_BASE_URL: "http://teslamateapi:8080"
      TESLAMATE_API_TOKEN: ""
      TESLAMATE_API_AUTH_HEADER: "Authorization"
      TESLAMATE_API_AUTH_SCHEME: "Bearer"
      CALENDAR_FEED_TOKEN: "change-me-to-random-token"
      DEFAULT_DAYS: "90"
      MAX_DAYS: "365"
      DEFAULT_TIMEZONE: "Asia/Shanghai"
      DEFAULT_VIEW: "normal"
      CACHE_TTL_SECONDS: "1800"
      REQUEST_TIMEOUT_SECONDS: "10"
      LOG_LEVEL: "info"
      TESLAMATE_DASHBOARD_URL_TEMPLATE: "https://grafana.example.com/d/teslamate/overview?from={from}&to={to}&var-car_id={car_id}&var-range={range}&var-event_id={event_id}"
